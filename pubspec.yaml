name: face_liveness_demo
description: A face liveness detection app using PyTorch Mobile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  cupertino_icons: ^1.0.6
  flutter_pytorch_lite: ^0.1.0+3
  http: ^1.2.0
  # Sets the multipart part type on the stage-2 upload. Already a transitive
  # dependency of http; named here because we import it directly.
  http_parser: ^4.0.2
  # JPEG-encodes the frame sent to the stage-2 backend.
  image: ^4.1.7
  # Remembers the backend URL and key, which change whenever the Kaggle
  # notebook behind the ngrok tunnel restarts.
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
